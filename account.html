<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | Camping Products Sales</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">⛺ CPS</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="promotions.html">Promotions</a></li>
                <li><a href="account.html" class="active">Account</a></li>
                <li><a href="reviews.html">Reviews</a></li>
            </ul>
        </nav>
    </header>

    <main class="container" style="margin-bottom: 90px;">
        <div class="form-wrapper">
            <h1>Create Membership Account</h1>
            <p>Join CPS Club to manage your memberships and unlock global discounts.</p>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Full Name:</label>
                    <input type="text" id="username" name="username">
                    <span class="error" id="nameError"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email">
                    <span class="error" id="emailError"></span>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password">
                    <span class="error" id="passError"></span>
                </div>
                <button type="submit" class="btn">Register Now</button>
            </form>
            <div id="accountSuccess" class="success-msg"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Camping Products Sales. All Rights Reserved.</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
